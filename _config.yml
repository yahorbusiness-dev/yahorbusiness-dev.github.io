# GitHub Pages (Jekyll) settings.
# Folders starting with "_" are normally never published. TEMPORARY: _admin/ is
# included so the admin panel can be tested at /admin.html (which loads
# _admin/admin.js). To make the panel local-only again, remove this include and
# admin.html.
include:
  - _admin
# Kept off the public site:
exclude:
  - supabase
  - CLAUDE.md
  - README.md
