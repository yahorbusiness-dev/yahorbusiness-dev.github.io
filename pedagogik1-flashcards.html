<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedagogik 1 – Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f3ff;
    color: #1a1a2e;
    padding: 24px 16px 60px;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 6px;
  }
  p.sub {
    text-align: center;
    color: #55516b;
    margin-bottom: 24px;
  }
  .progress {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
    color: #6d28d9;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    perspective: 1000px;
    height: 220px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card-front {
    background: #ede9fe;
    border: 2px solid #c4b5fd;
  }
  .card-front .num {
    width: 28px;
    height: 28px;
    line-height: 28px;
    border-radius: 50%;
    background: #6d28d9;
    color: white;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .card-front .q {
    font-weight: 700;
    font-size: 1.05rem;
  }
  .card-back {
    background: white;
    border: 2px solid #a78bfa;
    transform: rotateY(180deg);
    font-size: 0.85rem;
    overflow-y: auto;
    text-align: left;
    align-items: flex-start;
  }
  .card-back .ex {
    margin-top: 10px;
    font-style: italic;
    color: #6d28d9;
  }
  .essay .card-front {
    background: #dbeafe;
    border-color: #93c5fd;
  }
  .essay .card-front .num {
    background: #1d4ed8;
  }
  .essay .card-back {
    border-color: #60a5fa;
  }
  .section-title {
    max-width: 1100px;
    margin: 40px auto 12px;
    font-size: 1.2rem;
    font-weight: 700;
    color: #1d4ed8;
  }
  .controls {
    text-align: center;
    margin: 24px 0;
  }
  button {
    background: #6d28d9;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover {
    background: #5b21b6;
  }
</style>
</head>
<body>

<h1>Pedagogik 1 – Memory Cards</h1>
<p class="sub">👆 Klicka på ett kort för att vända det och se svaret!</p>
<div class="progress"><span id="seenCount">0</span> / <span id="totalCount">0</span> kort sedda</div>

<div class="controls">
  <button onclick="resetAll()">🔄 Vänd tillbaka alla</button>
</div>

<div class="grid" id="cardGrid"></div>

<h2 class="section-title">Essäfrågor</h2>
<div class="grid" id="essayGrid"></div>

<script>
const cards = [
  { q: "Vad är pedagogik?", a: "Pedagogik handlar om hur människor lär sig och utvecklas och hur pedagogen planerar och genomför undervisning.", ex: "En pedagog hjälper ett barn att lära sig skriva sitt namn." },
  { q: "Vad är lärande?", a: "Lärande är när man utvecklar nya kunskaper, färdigheter eller förståelse genom undervisning, erfarenheter, lek och samspel med andra.", ex: "Ett barn lär sig räkna genom att räkna leksaker." },
  { q: "Vad är utveckling?", a: "Utveckling är de förändringar som sker hos en människa över tid, t.ex. motoriskt, språkligt, socialt och känslomässigt.", ex: "Ett barn utvecklar sin finmotorik genom att rita och pärla." },
  { q: "Vad är pedagogiska teorier?", a: "Pedagogiska teorier är olika sätt att förklara hur människor lär sig och utvecklas. De hjälper pedagoger att förstå barn och välja arbetssätt.", ex: "En pedagog använder det sociokulturella perspektivet." },
  { q: "Vad är behaviorism?", a: "Behaviorismen fokuserar på beteenden och hur de påverkas av konsekvenser. Positiv konsekvens ökar chansen att beteendet upprepas.", ex: "Barnet får beröm när det städar och gör det igen." },
  { q: "Vad är kognitiv teori (Piaget)?", a: "Piagets kognitiva teori handlar om hur barn tänker och skapar kunskap genom att undersöka, prova och reflektera.", ex: "Barn sorterar föremål efter färg eller storlek." },
  { q: "Vad är sociokulturellt perspektiv (Vygotskij)?", a: "Barn lär sig genom samspel med andra. Språk, kommunikation och kultur har stor betydelse för lärandet.", ex: "Ett barn lär sig bygga genom att ett annat barn visar." },
  { q: "Vad är proximala utvecklingszonen?", a: "Det barnet nästan klarar själv men behöver stöd för att klara. Med hjälp kan barnet utvecklas och sen klara det själv.", ex: "Barnet kan nästan knyta sina skor men behöver lite hjälp." },
  { q: "Vad är motivation? (A) Inre och (B) Yttre motivation", a: "Motivation är det som får oss att vilja göra något.\nA) Inre motivation: man gör det för att man tycker att det är roligt eller viktigt.\nB) Yttre motivation: man gör det för att få belöning eller undvika något negativt.", ex: "Se baksidan." },
  { q: "Vad är lekens betydelse för lärande?", a: "Lek är viktig för lärande eftersom barn utvecklar språk, fantasi, problemlösning, motorik och sociala förmågor genom lek.", ex: "När barn leker affär tränar de på att kommunicera och räkna." },
  { q: "Vad är socialt samspel?", a: "Socialt samspel innebär att kommunicera och samarbeta med andra. Barn lär sig att lyssna, lösa konflikter och samarbeta.", ex: "Två barn bygger tillsammans och bestämmer hur de ska göra." },
  { q: "Vad är pedagogiskt förhållningssätt?", a: "Det handlar om hur pedagogen bemöter barnen. Att vara lyhörd, respektfull, trygg och se varje barns behov och förutsättningar.", ex: "Pedagogen anpassar aktiviteten så att alla barn kan vara med." },
  { q: "Vad är barnperspektiv?", a: "Att se barnet ur barnets eget perspektiv och ta hänsyn till barnets tankar, behov och önskemål. Barnet ska få vara delaktigt och påverka.", ex: "Barnen får välja aktivitet genom att ge sina förslag." },
];

const essays = [
  { q: "Fråga 1: Beskriv vad pedagogiska teorier är. Välj två teorier och förklara hur de kan synas i förskolans/skolans vardag.", a: "Pedagogiska teorier är olika sätt att förklara hur människor lär sig och utvecklas. De hjälper pedagoger att förstå barn och välja arbetssätt.", ex: "Behaviorism – belöning och konsekvenser, t.ex. beröm när barnet hjälper till. Sociokulturellt perspektiv – samspel och kommunikation, t.ex. barn lär av varandra när de bygger tillsammans." },
  { q: "Fråga 2: Förklara varför motivation är viktig för barns lärande och utveckling. Resonera kring skillnaden mellan inre och yttre motivation och ge exempel.", a: "Motivation gör att barn vill lära och fortsätta även när det är svårt.\nInre motivation: barnet gör det för att det är roligt/meningsfullt (t.ex. bygger lego för att det är kul).\nYttre motivation: barnet gör det för att få belöning/beröm (t.ex. städar för att få en stjärna). Båda kan vara viktiga." },
  { q: "Fråga 3: Beskriv hur socialt samspel påverkar barns lärande. Koppla ditt svar till en pedagogisk teori.", a: "Barn lär sig genom att kommunicera och samarbeta med andra. Enligt Vygotskij (sociokulturellt perspektiv) utvecklas barn i samspel med andra och med stöttning inom den proximala utvecklingszonen.", ex: "Barn lär sig spelregler av varandra när de spelar ett spel." },
  { q: "Fråga 4: Förklara lekens betydelse för barns lärande och motivation. Hur ska det pedagogiska förhållningssättet stödja detta?", a: "Lek är viktig för lärande eftersom barn utvecklar många förmågor och lär sig på ett lustfyllt sätt. Lek ökar motivation och kreativitet.", ex: "Pedagogen ska vara lyhörd, närvarande och skapa miljöer som stödjer leken, observera, ställa frågor och stötta när det behövs utan att styra för mycket." },
];

function buildCard(item, index, container, essay) {
  const card = document.createElement('div');
  card.className = 'card' + (essay ? ' essay' : '');
  card.innerHTML = `
    <div class="card-inner">
      <div class="card-face card-front">
        <div class="num">${index + 1}</div>
        <div class="q">${item.q}</div>
      </div>
      <div class="card-face card-back">
        <div>${item.a.replace(/\n/g, '<br>')}</div>
        ${item.ex ? `<div class="ex">Exempel: ${item.ex}</div>` : ''}
      </div>
    </div>
  `;
  card.addEventListener('click', () => {
    if (!card.classList.contains('flipped')) {
      seen.add(card.dataset.id);
      updateProgress();
    }
    card.classList.toggle('flipped');
  });
  card.dataset.id = (essay ? 'e' : 'c') + index;
  container.appendChild(card);
}

const seen = new Set();
const total = cards.length + essays.length;
document.getElementById('totalCount').textContent = total;

function updateProgress() {
  document.getElementById('seenCount').textContent = seen.size;
}

const cardGrid = document.getElementById('cardGrid');
const essayGrid = document.getElementById('essayGrid');
cards.forEach((c, i) => buildCard(c, i, cardGrid, false));
essays.forEach((e, i) => buildCard(e, i, essayGrid, true));

function resetAll() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
}
</script>

</body>
</html>
